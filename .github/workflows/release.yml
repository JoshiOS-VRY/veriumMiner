name: Release

# Build, test, package, checksum and publish prebuilt binaries for every
# supported platform whenever a vX.Y.Z tag is pushed (or on manual dispatch).
#
# Signing is wired in but optional: the Windows Authenticode and macOS
# notarization steps run only when the corresponding repository secrets are
# present. Without them the workflow still produces unsigned binaries plus a
# SHA256SUMS file so users can verify integrity.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.4.0)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Linux (x86_64 + ARM64) — near-static (libgcc/libstdc++ static, glibc +
  # libcurl dynamic; jansson is static via FetchContent when not installed).
  # -------------------------------------------------------------------------
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test (golden hash)
        run: |
          ctest --test-dir build --output-on-failure || ./build/cpuminer --cputest
          # ARM64 jobs run under emulation where the ~1GB scratchpad self-test
          # can be slow/unavailable; gate natively on x86_64 only.
          if [ "${{ matrix.runner }}" != "ubuntu-24.04-arm" ]; then ./build/cpuminer --selftest; fi
      - name: Package
        run: bash contrib/packaging/package.sh "${{ matrix.runner == 'ubuntu-24.04-arm' && 'linux-arm64' || 'linux-x86_64' }}" build/cpuminer
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*

  # -------------------------------------------------------------------------
  # macOS (Apple Silicon + Intel) — self-contained (system libcurl + static
  # jansson). Notarization runs only when APPLE_* secrets exist.
  # -------------------------------------------------------------------------
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  runner: macos-14 }
          - { arch: x86_64, runner: macos-15-intel }
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build tools
        run: brew install cmake jansson curl
      - name: Configure
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix jansson);$(brew --prefix curl)" >> "$GITHUB_ENV"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test (golden hash)
        run: ./build/cpuminer --cputest && ./build/cpuminer --selftest
      - name: Code sign (optional)
        if: env.MACOS_SIGN_IDENTITY != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" build/cpuminer
          codesign --verify --verbose build/cpuminer
      - name: Package
        run: bash contrib/packaging/package.sh "macos-${{ matrix.arch }}" build/cpuminer
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*

  # -------------------------------------------------------------------------
  # Windows (x86_64) — fully static, single self-contained cpuminer.exe with
  # no MinGW DLL dependencies. Authenticode signing runs only when the
  # WIN_CODESIGN_* secrets exist. Also builds the NSIS installer.
  # -------------------------------------------------------------------------
  windows:
    name: windows-x86_64
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: msys2 {0}
    env:
      WIN_CODESIGN_PFX_BASE64: ${{ secrets.WIN_CODESIGN_PFX_BASE64 }}
      WIN_CODESIGN_PASSWORD: ${{ secrets.WIN_CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-jansson
            mingw-w64-x86_64-nsis
      - name: Configure (static)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test (golden hash)
        run: |
          ctest --test-dir build --output-on-failure || ./build/cpuminer.exe --cputest
          ./build/cpuminer.exe --selftest
      - name: Verify no DLL dependencies
        run: |
          echo "Dependencies:"
          ldd build/cpuminer.exe || true
          if ldd build/cpuminer.exe | grep -iqE 'mingw64|libcurl|libjansson|libwinpthread'; then
            echo "ERROR: static build still has MinGW DLL dependencies" >&2
            exit 1
          fi
      - name: Code sign (optional, Authenticode)
        if: env.WIN_CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = [System.Convert]::FromBase64String($env:WIN_CODESIGN_PFX_BASE64)
          [IO.File]::WriteAllBytes("cert.pfx", $pfx)
          $st = (Get-Command signtool.exe -ErrorAction SilentlyContinue)
          if (-not $st) { $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1 }
          & $st.Source sign /f cert.pfx /p $env:WIN_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build/cpuminer.exe
          & $st.Source verify /pa build/cpuminer.exe
      - name: Build NSIS installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="${{ github.event.inputs.tag }}"; VERSION="${VERSION#v}"; fi
          cp build/cpuminer.exe .
          makensis -DMINER_VERSION="${VERSION:-0.0.0}" cpuminer.nsi || makensis cpuminer.nsi
      - name: Package
        run: |
          bash contrib/packaging/package.sh "windows-x86_64" build/cpuminer.exe
          # include installer if it was produced
          if [ -f veriumminer-setup.exe ]; then cp veriumminer-setup.exe dist/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist/*

  # -------------------------------------------------------------------------
  # Aggregate artifacts, generate SHA256SUMS, and publish the GitHub Release.
  # -------------------------------------------------------------------------
  release:
    name: publish-release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          echo "Release contents:"; ls -la
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Verium Miner ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true

  # -------------------------------------------------------------------------
  # Multi-arch Docker image published to GHCR.
  # -------------------------------------------------------------------------
  docker:
    name: docker-ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "tags=${REPO}:${VER},${REPO}:latest" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
