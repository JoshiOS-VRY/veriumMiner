name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ---------------------------------------------------------------------
  # Linux + macOS (native runners, incl. Apple Silicon and Intel Mac)
  # ---------------------------------------------------------------------
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64 (GCC)",     os: ubuntu-latest,    cc: gcc,   cxx: g++ }
          - { name: "Linux x86_64 (Clang)",   os: ubuntu-latest,    cc: clang, cxx: clang++ }
          - { name: "Linux ARM64 (GCC)",      os: ubuntu-24.04-arm, cc: gcc,   cxx: g++ }
          - { name: "macOS Apple Silicon",    os: macos-14,         cc: clang, cxx: clang++ }
          # macos-13 was retired Dec 2025; macos-15-intel is the last hosted x86_64 Mac image.
          - { name: "macOS Intel",            os: macos-15-intel,   cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libjansson-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install jansson curl
          echo "CMAKE_PREFIX_PATH=$(brew --prefix jansson);$(brew --prefix curl)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Hash regression tests
        run: ctest --test-dir build --output-on-failure

      - name: cputest (golden hash print)
        run: ./build/cpuminer --cputest
      - name: Self-test (golden-vector gate)
        run: ./build/cpuminer --selftest

  # ---------------------------------------------------------------------
  # Windows (MSYS2 / MinGW-w64)
  # ---------------------------------------------------------------------
  windows:
    name: windows-mingw64
    # windows-latest → windows-2025-vs2026 by 2026-06-15; this job uses MSYS2 MinGW, not VS.
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-jansson
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Hash regression tests
        run: ctest --test-dir build --output-on-failure
      - name: cputest
        run: ./build/cpuminer.exe --cputest
      - name: Self-test (golden-vector gate)
        run: ./build/cpuminer.exe --selftest
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpuminer-windows-mingw64
          path: build/cpuminer.exe

  # ---------------------------------------------------------------------
  # Warnings-as-errors gate (known-clean GCC config)
  # ---------------------------------------------------------------------
  werror:
    name: warnings-as-errors (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libjansson-dev
      - name: Configure (-Werror)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWERROR=ON
      - name: Build
        run: cmake --build build -j

  # ---------------------------------------------------------------------
  # Address/UndefinedBehavior sanitizers — exercises the mining loop and the
  # cooperative shutdown path (SIGTERM) to catch leaks and UB.
  # ---------------------------------------------------------------------
  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libjansson-dev
      - name: Configure (sanitizers, no LTO)
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_LTO=OFF
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Golden hash under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/cpuminer --cputest
      - name: Mining + graceful shutdown under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ./build/cpuminer --benchmark -t 2 --api-bind 127.0.0.1:0 &
          PID=$!
          sleep 25
          kill -TERM $PID
          # Exit code 0 means the cooperative shutdown completed cleanly.
          wait $PID

  # ---------------------------------------------------------------------
  # Static analysis (cppcheck) — fails on genuine errors.
  # ---------------------------------------------------------------------
  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      # Errors-only gate (real bugs: leaks, OOB, null deref). This fails the job.
      - name: cppcheck (errors gate)
        run: |
          cppcheck --quiet --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --library=posix \
            -I include -I . \
            src
      # Broader analysis (style/perf/portability) is informational for now so
      # legacy findings don't block PRs; review the output and tighten later.
      - name: cppcheck (informational, full)
        continue-on-error: true
        run: |
          cppcheck --quiet \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --library=posix \
            -I include -I . \
            src

  # ---------------------------------------------------------------------
  # FreeBSD (via VM action)
  # ---------------------------------------------------------------------
  freebsd:
    name: freebsd-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build & test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake curl jansson
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j$(sysctl -n hw.ncpu)
            ctest --test-dir build --output-on-failure
            ./build/cpuminer --cputest
